<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício</title>
    <link rel="stylesheet" href="assets/style.css">
</head>

<body>
    <section class="container">
        <h1>Tabela de Prazos</h1>
        
        <div class="table">
            <div>
                <h2>Distância</h2>
                <p>
                    Até 50 km <br>
                    De 51 a 200 km <br>
                    Acima de 200 km <br>
                </p>
            </div>

            <div>
                <h2>Tipo de Entrega</h2>
                <p>
                    Entrega Local <br>
                    Entrega Regional <br>
                    Entrega Nacional <br>
                </p>
            </div>
        </div>

        <h1>Calculador de Frete</h1>
        <form action="" class="form">
            <label for="peso">Peso (KG):</label>
            <input type="text" id="peso">

            <label for="altura">Distância (KM):</label>
            <input type="text" id="distancia">

            <button>Calcular Frete</button>
        </form>

        <div class="texto"></div>
    </section>

    <script src="assets/index.js"></script>
</body>

</html>
