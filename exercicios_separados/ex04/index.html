<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício</title>
    <link rel="stylesheet" href="assets/style.css">
</head>

<body>
    <section class="container">
        <h1>Simulador de economia mensal</h1>
        
        <div class="table">
            <div>
                <h2>Total acumulado</h2>
                <p>
                    Até R$ 1.000,00 <br>
                    De R$ 1.001,00 a R$ 5.000,00 <br>
                    De R$ 5.001,00 a R$ 15.000,00 <br>
                    Acima de R$ 15.000,00 <br>
                </p>
            </div>

            <div>
                <h2>Nível</h2>
                <p>
                    Reserva Inicial <br>
                    Fundo de Emergência em Construção <br>
                    Reserva Consolidada <br>
                    Patrimônio Avançado <br>
                </p>
            </div>
        </div>

        <h1>Calculador de Economia</h1>
        <form action="" class="form">
            <label for="peso">Valor por Mês (R$):</label>
            <input type="text" id="valor">

            <label for="altura">Quantidade de Meses:</label>
            <input type="text" id="meses">

            <button>Calcular Economia</button>
        </form>

        <div class="texto"></div>
    </section>

    <script src="assets/index.js"></script>
</body>

</html>
